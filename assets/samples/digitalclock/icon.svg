<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <radialGradient id="bg-grad" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#121722"/>
      <stop offset="100%" stop-color="#050608"/>
    </radialGradient>
    <filter id="icon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 베젤 배경 -->
  <rect width="192" height="192" rx="42" fill="url(#bg-grad)"/>
  <rect x="3" y="3" width="186" height="186" rx="39" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="2.5"/>

  <!-- 7-Segment 스타일의 7과 콜론 그래픽 -->
  <!-- 은은한 꺼진 세그먼트 배경 -->
  <g fill="rgba(255,255,255,0.08)" transform="translate(46, 36) scale(0.2)">
    <!-- 8 세그먼트 배경 -->
    <path d="M 380 320 L 420 360 L 380 400 L 120 400 L 80 360 L 120 320 Z M 440 370 L 460 390 L 460 670 Q 450 710 410 720 L 380 640 L 380 430 Z M 390 720 L 90 720 Q 50 710 40 670 L 120 640 L 360 640 Z M 40 650 L 40 390 L 60 370 L 120 430 L 120 620 Z M 360 80 L 121 80 L 41 50 Q 51 10 91 0 L 390 0 Z M 120 100 L 120 290 L 60 350 L 40 330 L 40 70 Z M 380 290 L 380 80 L 410 0 Q 450 10 460 50 L 460 330 L 440 350 Z"/>
  </g>

  <!-- 켜진 7 세그먼트 -->
  <g fill="#ffffff" filter="url(#icon-glow)" transform="translate(46, 36) scale(0.2)">
    <!-- 7 세그먼트 (상단, 우상단, 우하단) -->
    <path d="M 440 370 L 460 390 L 460 670 Q 450 710 410 720 L 380 640 L 380 430 Z M 360 80 L 121 80 L 41 50 Q 51 10 91 0 L 390 0 Z M 380 290 L 380 80 L 410 0 Q 450 10 460 50 L 460 330 L 440 350 Z"/>
  </g>
</svg>
