<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <!-- CSP meta를 두지 않는다: srcdoc 앱 iframe이 셸의 CSP를 상속하기 때문 (ARCHITECTURE §4.4) -->
  <title>BeBeam</title>
  <meta name="robots" content="noindex">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon.ico" sizes="16x16 32x32 48x48">
  <link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#09090b" media="(prefers-color-scheme: dark)">
  <script src="js/theme-init.js"></script>
  <link rel="stylesheet" href="css/player.css">
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <div class="shell" id="shell">
    <header class="app-header">
      <h1 class="brand"><img class="brand-icon" src="icons/icon-192.png" alt="" width="24" height="24"> BeBeam</h1>
      <div class="header-actions">
        <button type="button" class="icon-button" id="theme-button"></button>
        <button type="button" class="icon-button" id="settings-button" aria-label="설정" title="설정" data-icon="settings"></button>
      </div>
    </header>

    <div class="install-banner" id="install-banner" role="region" aria-label="설치 안내" hidden></div>

    <section class="viewer" id="viewer" aria-label="뷰어">
      <p class="viewer-hint" id="viewer-hint">
        <span class="only-landscape">왼쪽</span><span class="only-portrait">아래</span> 목록에서 앱을 선택하세요
      </p>
    </section>

    <section class="library" aria-label="앱 목록">
      <ul class="app-list" id="app-list"></ul>
      <p class="empty" id="empty" hidden>아래 '나의 앱 추가' 버튼을 눌러서<br>멋진 작품을 등록하세요</p>
      <div class="library-footer">
        <div class="footer-actions">
          <button type="button" class="add-button" id="add-button" data-icon="plus">나의 앱 추가</button>
          <button type="button" class="receive-button" id="receive-button" data-icon="scan-qr-code">앱 받기</button>
        </div>
        <p class="version" id="version"></p>
        <button type="button" class="install-help" id="install-help" data-icon="download" hidden>비빔 앱 설치하기</button>
        <a class="site-link" id="site-link" href="https://www.bebeam.net/" target="_blank" rel="noopener" hidden>비빔 웹앱런처 www.bebeam.net</a>
      </div>
    </section>
  </div>

  <div class="notice" id="notice" role="alert" hidden></div>
</body>
</html>
