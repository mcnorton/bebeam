<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
  <title>Toybox</title>
  <meta name="description" content="내가 만든 웹앱을 폰에 담고, 친구와 폰을 맞대어 나누는 플레이어">
  <link rel="icon" href="player/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="player/icons/apple-touch-icon.png">
  <style>
    :root { color-scheme: light dark; --bg: #fafaf7; --fg: #1d1d1b; --muted: #6b6b66; --accent: #2a6ae8; --accent-text: #fff; }
    @media (prefers-color-scheme: dark) { :root { --bg: #141413; --fg: #f0efea; --muted: #9a9993; --accent: #5b92ff; --accent-text: #0b1530; } }
    body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
           font-family: system-ui, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
    main { padding: 24px 16px; max-width: 480px; text-align: center; }
    .logo { width: 96px; height: 96px; margin: 0 auto 16px; display: block; }
    h1 { font-size: 2rem; margin: 0 0 12px; }
    p { line-height: 1.6; margin: 0 0 8px; }
    .launch { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; min-width: 220px;
              margin: 24px 0; padding: 0 24px; border-radius: 14px; background: var(--accent); color: var(--accent-text);
              font-size: 1.1rem; font-weight: 700; text-decoration: none; }
    .launch:focus-visible { outline: 3px solid var(--fg); outline-offset: 3px; }
    .features { margin: 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 16px;
                color: var(--muted); font-size: .9rem; }
    .features li::before { content: "· "; }
  </style>
</head>
<body>
  <main>
    <img class="logo" src="player/icons/icon.svg" alt="">
    <h1>Toybox</h1>
    <p>내가 만든 웹앱을 폰에 담고,<br>친구와 폰을 맞대어 나눠요.</p>
    <a class="launch" id="launch" href="./player/"><span aria-hidden="true">▶</span> 플레이어 실행</a>
    <ul class="features">
      <li>서버 없이</li>
      <li>오프라인 실행</li>
      <li>안전한 샌드박스</li>
    </ul>
  </main>
  <script src="assets/landing.js"></script>
</body>
</html>
